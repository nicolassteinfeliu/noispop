# Opción A — "Hiperreal"
# Foley y ambientes creíbles que vuelven tangible el mundo; elegancia por contención.
# Siempre por debajo de música y locución. Sin subs, brillos ni tonos diseñados (bus SUB sin uso).
# Por pedido del cliente se admite aire natural en movimientos de cámara rápidos (des.whoosh con tone 0 y
# comb 0, contenido, bus DES): salida del túnel (A455) y el aéreo del desierto (25.2-26.4, cues del orquestador).
# Autos ELÉCTRICOS: rodado, aero, AVAS (solo en movimiento lento) y siseo de agua; jamás motor de combustión.
# Ronda 2: cues desactivados con enabled: false (A040, A115, A235, A325, A525); motivo en su notes_es.
# Frames = verdad (24 fps). Spotting hecho cuadro a cuadro sobre media/picture.mov (out/spot_a/tile_*.png).
# Sub-cortes vistos en imagen que no están en cuts[]: 56 (oscuro->torres), 308 (paso de rueda), 404/418
# (arco -> ruta oscura -> haces), 747 (lago -> mano), 771 (bosque -> EX5 frente), 801 (EX2 por parabrisas),
# 838 (capó), 989 (portón). Se citan como "f:<n>".
option: A
title: "Hiperreal"
cues:

  # ======================================================= 0.00-1.21 PASO BAJO AL AMANECER (hueco VO 0-1.15)
  - id: A010_underpass_room
    recipe: amb.room_tone
    at: 0.0
    dur: 1.5
    bus: AMB
    gain_db: -13
    params: {space: underpass, air_db: -18, rumble_db: -8}
    width: 1.0
    fade_in: 0.2
    fade_out: 0.17
    until: "cut[0]+4"
    vo_protect: normal
    sync: {type: free}
    notes_es: "Tono de hormigón bajo el paso elevado; cola L-cut 4 cuadros sobre la rueda"

  - id: A020_underpass_city_wash
    recipe: amb.city_distant
    at: 0.0
    dur: 1.5
    bus: AMB
    gain_db: -19
    params: {density: 0.3, lp_hz: 500, passbys: 1, fog: true}
    width: 1.0
    fade_in: 0.3
    fade_out: 0.17
    until: "cut[0]+4"
    vo_protect: normal
    sync: {type: free}
    notes_es: "Ciudad lejana al amanecer más allá de la boca del paso (hombre en silueta)"

  - id: A030_underpass_drips
    recipe: amb.drips
    seed: 2                 # toma con 2 gotas tardías (0.82 y 0.97 s) y menos resonancia sostenida
    at: 0.0
    dur: 1.3
    bus: AMB
    gain_db: -18
    params: {rate: 2.2, space: underpass_concrete, pitch: 1.0}
    pan: -0.35
    width: 1.2
    fade_in: 0.05
    fade_out: 0.1
    until: "cut[0]+2"
    vo_protect: normal
    sync: {type: free}
    notes_es: "Dos gotas tardías (0.82 y 0.97 s) en los pilares de la izquierda, con su reverb de hormigón"

  - id: A040_underpass_ex2_avas
    recipe: veh.avas_idle
    at: 0.0
    dur: 1.4
    bus: VEH
    gain_db: -22
    params: {level: 0.2}
    pan: 0.2
    width: 0.8
    fade_in: 0.35
    fade_out: 0.1
    until: "cut[0]+2"
    vo_protect: normal
    sync: {type: free}
    notes_es: "DESACTIVADO (r2): el EX2 está estacionado e inmóvil f0-28; un EV detenido no emite AVAS y la tríada Eb/F/Bb sonaba como parte de la música"
    enabled: false

  # ======================================================= 1.21-2.33 RUEDA (oscurece ~2.04 s, f49)
  - id: A050_wheel_spin
    recipe: veh.wheel_spin
    at: "cut[0]"
    dur: 1.2
    bus: VEH
    gain_db: -16
    params: {speed_kmh: 40, disc_whir: 0.5, darken_at: 0.6}
    width: 1.0
    fade_in: 0.02
    fade_out: 0.15
    until: "f:57"
    gain_curve: [[0, 0], [0.8, 0], [0.95, -8]]
    vo_protect: strong
    sync: {type: cut, frame: 29}
    notes_es: "Rueda en primer plano: rodado + whir de disco; baja 8 dB y se oscurece cuando la imagen va a negro (f50-55)"

  # ======================================================= 2.29-2.75 ENTRE TORRES (f56-65, hueco VO 2.59-3.39)
  - id: A060_towers_onboard
    recipe: veh.onboard_roll
    at: "f:55"
    dur: 0.6
    bus: VEH
    gain_db: -12
    params: {speed_kmh: 70, surface: dry, perspective: onboard}
    width: 1.3
    fade_in: 0.08
    fade_out: 0.04
    until: "cut[1]"
    send: {preset: city_day_street, db: -8}
    vo_protect: normal
    sync: {type: frame, frame: 56}
    notes_es: "Contrapicado veloz entre torres: aero + rodado onboard, reflexiones (slap) de las fachadas"

  # ======================================================= 2.75-3.17 EX2 DE FRENTE, AVANZA LENTO (f66-75, hueco VO)
  - id: A065_ex2_front_avas
    recipe: veh.avas_idle
    at: "cut[1]-1"
    dur: 0.6
    bus: VEH
    gain_db: -24
    params: {level: 0.25}
    width: 0.8
    fade_in: 0.04
    fade_out: 0.04
    until: "cut[2]"
    vo_protect: none
    sync: {type: cut, frame: 66}
    notes_es: "EX2 avanzando lento hacia cámara: AVAS como susurro debajo del rodado mojado (A067)"

  - id: A067_ex2_front_wet_roll
    recipe: veh.approach
    at: "cut[2]"
    dur: 0.4
    bus: VEH
    gain_db: -12
    params: {speed_kmh: 12, start_m: 6, end_m: 3, surface: wet, ev: 0.2, extra_rise_db: 0}
    fade_in: 0.04
    fade_out: 0.04
    until: "cut[2]+1"
    vo_protect: none
    sync: {type: cut, frame: 76}
    notes_es: "Neumáticos rodando lento sobre piso mojado mientras el EX2 avanza a cámara (hueco VO 2.59-3.39)"

  # ======================================================= 3.17-3.96 PASO ELEVADO, AUTO HACIA CÁMARA
  - id: A070_overpass_approach
    recipe: veh.approach
    at: "f:94"
    dur: 0.8
    bus: VEH
    gain_db: -12
    params: {speed_kmh: 60, start_m: 25, end_m: 4, surface: dry, ev: 0.4}
    fade_out: 0.06
    until: "cut[3]+2"
    vo_protect: strong
    sync: {type: frame, frame: 94}
    notes_es: "EX2 avanza por la avenida vacía y llega a cámara en f94 (último cuadro antes del faro)"

  # ======================================================= 3.96-5.17 FARO EN LA NIEBLA (restricción)
  - id: A080_headlight_fog_air
    recipe: amb.fog_air
    at: "cut[3]-3"
    dur: 1.4
    bus: AMB
    gain_db: -21
    params: {brightness: 0.4, motion: 0.3}
    width: 1.1
    fade_in: 0.12
    fade_out: 0.05
    until: "cut[4]"
    vo_protect: normal
    sync: {type: free}   # J-cut: cama que entra antes del corte
    notes_es: "Niebla casi silenciosa alrededor del faro; entra 3 cuadros antes del corte"

  - id: A085_headlight_relay
    recipe: fol.relay_click
    at: "cut[3]"
    dur: 0.3
    bus: FOL
    gain_db: -12
    params: {}
    pan: -0.1
    vo_protect: none
    sync: {type: cut, frame: 95}
    notes_es: "Clic de relé muy sutil: el faro aparece encendido justo en el corte (5 ms: sin protección VO, no enmascara la voz)"

  # ======================================================= 5.17-6.63 POV INTERIOR, SEMÁFORO ROJO (hueco VO 5.25-6.59)
  - id: A090_pov_cabin_still
    recipe: amb.cabin_still
    at: "cut[4]-3"
    dur: 1.7
    bus: AMB
    gain_db: -12
    params: {hvac: 0.25, exterior: city_fog}
    width: 1.1
    fade_in: 0.12
    fade_out: 0.05
    until: "cut[5]+1"
    vo_protect: normal
    sync: {type: free}   # J-cut: cama que entra antes del corte
    notes_es: "Cabina detenida: HVAC + ciudad con niebla a través del vidrio; el mundo respira en el hueco"

  - id: A095_pov_panda_far_steps
    recipe: cre.panda_steps
    at: "f:132"
    dur: 1.4
    bus: FOL
    gain_db: -19
    params: {steps: 3, gait_s: 0.45, surface: wet_asphalt, weight: 0.8, body_db: -6}
    pan: -0.3
    width: 0.6
    fade_out: 0.15
    until: "cut[5]+1"
    send: {preset: city_fog_street, db: -6}
    vo_protect: normal
    sync: {type: frame, frame: 132}
    notes_es: "Panda lejano cruzando frente a los faros del otro auto, en el hueco VO: pasos lejanos (cuerpo -6) que se leen; la cola de calle corta al plano del panda"

  # ======================================================= 6.63-14.58 CALLE CON NIEBLA (cama continua, con hueco interior en la pata)
  - id: A100_fog_street_room
    recipe: amb.room_tone
    at: "cut[5]-1"
    dur: 8.1
    bus: AMB
    gain_db: -23
    params: {space: city_fog, air_db: -16, rumble_db: -8}
    width: 1.1
    fade_in: 0.05
    fade_out: 0.06
    until: "cut[12]"
    gain_curve: [[0, 0], [0.82, 0], [0.88, -10], [1.5, -10], [1.56, 0], [8.1, 0]]
    vo_protect: strong
    sync: {type: cut, frame: 159}
    notes_es: "Calle con niebla (pandas, EX2, poste): baja 10 dB mientras estamos dentro del auto (pata, f179-194)"

  - id: A105_fog_street_city
    recipe: amb.city_distant
    at: "cut[5]-1"
    dur: 8.1
    bus: AMB
    gain_db: -26
    params: {density: 0.4, lp_hz: 500, passbys: 1, fog: true}
    width: 1.15
    fade_in: 0.05
    fade_out: 0.06
    until: "cut[12]"
    gain_curve: [[0, 0], [0.82, 0], [0.88, -8], [1.5, -8], [1.56, 0], [8.1, 0]]
    vo_protect: strong
    sync: {type: cut, frame: 159}
    notes_es: "Wash de ciudad lejana bajo la niebla, mismo recorrido que A100"

  # ----- 6.63-7.46 panda cruzando frente a los faros
  - id: A110_panda_cross_steps
    recipe: cre.panda_steps
    at: "f:168"
    dur: 0.9
    bus: FOL
    gain_db: -6
    params: {surface: wet_asphalt, weight: 1.0, step_times: [0.0, 0.25], body_db: -6, detail_db: 3}
    pan: [[0, -0.1], [0.5, 0.05]]
    width: 0.7
    fade_out: 0.06
    until: "cut[6]+1"
    send: {preset: city_fog_street, db: -12}
    vo_protect: strong
    sync: {type: frame, frame: 168}
    notes_es: "Apoyo de la pata trasera cercana en f168 (contacto medido) y lejana en f174; cuerpo -6 / detalle +3 para que lean almohadilla y uñas sobre la música"

  - id: A115_panda_cross_breath
    recipe: cre.panda_breath
    at: "f:162"
    dur: 0.8
    bus: FOL
    gain_db: -19
    params: {type: exhale, close: false}
    pan: -0.1
    send: {preset: city_fog_street, db: -12}
    vo_protect: strong
    sync: {type: frame, frame: 162}
    notes_es: "DESACTIVADO (r2): inaudible (0.04) y subirlo cuesta demasiada locución; el cruce ya lo cuentan los pasos A110"
    enabled: false

  # ----- 7.46-8.13 pata contra el parabrisas (HERO), desde dentro
  - id: A120_paw_cabin_still
    recipe: amb.cabin_still
    at: "cut[6]-1"
    dur: 0.85
    bus: AMB
    gain_db: -16
    params: {hvac: 0.2, exterior: city_fog}
    fade_in: 0.04
    fade_out: 0.05
    until: "cut[7]+1"
    vo_protect: strong
    sync: {type: cut, frame: 179}
    notes_es: "Volvemos al interior: HVAC suave detrás de la pata"

  - id: A125_paw_on_glass
    recipe: cre.paw_on_glass
    at: "cut[6]"
    dur: 0.9
    bus: FOL
    gain_db: -4
    params: {press_ms: 600, squeak: 0.9, sniff: true, inside: true, body_db: -4}
    pan: 0.15
    width: 0.8
    fade_out: 0.06
    until: "cut[7]+1"
    vo_protect: strong
    sync: {type: cut, frame: 179}
    notes_es: "HERO: contacto en el corte (la pata ya apoyada), chirrido largo mientras desliza (f180-187), la pata no se despega hasta el final del plano (release f194); olfateo; thump -4 dB"

  - id: A127_paw_fur_glass
    recipe: cre.fur_rustle
    at: "cut[6]"
    dur: 0.55
    bus: FOL
    gain_db: -6
    params: {intensity: 0.6, brightness: 0.9, space: cabin_small, send_db: -14}
    pan: 0.15
    fade_out: 0.1
    until: "cut[7]"
    vo_protect: strong
    sync: {type: cut, frame: 179}
    notes_es: "Pelaje de la pata frotando el parabrisas, brillante (>5 kHz), para que el HERO lea sobre la voz"

  # ----- 8.13-10.54 filas de pandas / EX2 entre pandas
  - id: A130_panda_crowd
    recipe: cre.panda_crowd
    at: "cut[7]-1"
    dur: 4.3
    bus: FOL
    gain_db: -24
    params: {density: 0.5, distance: mid}
    width: 1.1
    fade_in: 0.06
    fade_out: 0.3
    until: "cut[10]"
    gain_curve: [[0, 0], [2.4, 0], [2.6, -7], [4.3, -7]]
    vo_protect: strong
    sync: {type: cut, frame: 195}
    notes_es: "Presencia de cientos de pandas a ambos lados (roces de pelaje, resoplidos lejanos); se aleja en el perfil"

  - id: A135_ex2_between_pandas_avas
    recipe: veh.avas_idle
    at: "cut[8]-1"
    dur: 2.95
    bus: VEH
    gain_db: -21
    params: {level: 0.3}
    width: 0.8
    fade_in: 0.08
    fade_out: 0.1
    until: "cut[10]"
    gain_curve: [[0, 0], [1.1, 0], [1.25, -8], [2.95, -8]]
    vo_protect: normal
    sync: {type: cut, frame: 226}
    notes_es: "EX2 avanzando entre las filas (micro-pausa VO 9.22-9.38 justo antes); queda lejano detrás del perfil"

  - id: A140_ex2_between_pandas_glide
    recipe: veh.wet_glide
    seed: 5                 # toma elegida: su pico de energía cae en el cuadro de sync
    at: "f:250"
    dur: 2.0
    bus: VEH
    gain_db: -21
    params: {speed_kmh: 12, sizzle: 0.5}
    width: 0.5
    fade_in: 0.3
    fade_out: 0.1
    until: "cut[9]+2"
    vo_protect: normal
    sync: {type: frame, frame: 250}
    notes_es: "Siseo lento de neumáticos en asfalto mojado, muy bajo; más cercano al final del plano (f250)"

  # ----- 10.54-12.29 perfil de panda (hueco VO 10.27-10.94)
  - id: A145_panda_profile_sniff
    recipe: cre.panda_breath
    at: "f:255"
    dur: 0.6
    bus: FOL
    gain_db: -11
    params: {type: sniff, close: true, count: 2}
    pan: 0.1
    fade_out: 0.12
    until: "f:266"
    vo_protect: none
    sync: {type: frame, frame: 255}
    notes_es: "Dos olfateos cercanos del panda en primer plano, dentro del hueco sin locución (sin protección: until f266 ya lo saca antes de que vuelva la voz)"

  - id: A150_panda_profile_exhale
    recipe: cre.panda_breath
    at: "f:276"
    dur: 0.8
    bus: FOL
    gain_db: -16
    params: {type: exhale, close: true}
    pan: 0.1
    vo_protect: strong
    sync: {type: frame, frame: 276}
    notes_es: "Exhalación lenta y cercana, bajo la locución (protección fuerte)"

  # ======================================================= 12.29-14.00 EX2 SE DESLIZA / PASO DE RUEDA (f308) / FOCOS (13.5)
  - id: A160_glide_wheel_arch
    recipe: veh.wet_glide
    seed: 5                 # toma elegida: su pico de energía cae en el cuadro de sync
    at: "f:308"
    dur: 1.1
    bus: VEH
    gain_db: -10
    params: {speed_kmh: 20, sizzle: 0.6, closest_m: 1.2}
    fade_in: 0.12
    fade_out: 0.2
    until: "f:321"
    vo_protect: normal
    sync: {type: frame, frame: 308}
    notes_es: "Rueda delantera pasando pegada a cámara en el sub-corte f308 (bajo la locución)"

  - id: A162_glide_rear_wheel
    recipe: veh.wet_glide
    seed: 4                 # toma elegida: su pico de energía cae en el cuadro de sync
    at: "f:319"
    dur: 1.6
    bus: VEH
    gain_db: -7
    params: {speed_kmh: 20, sizzle: 0.7, closest_m: 1.2, direction: 1, peak_pos: 0.35}
    pan: [[0, 0], [0.6, 0], [0.85, -0.45], [1.6, -0.6]]
    fade_in: 0.06
    fade_out: 0.3
    until: "cut[11]+2"
    gain_curve: [[0, -3], [0.42, -3], [0.5, 0], [0.9, 0], [1.6, -4]]
    vo_protect: light
    sync: {type: frame, frame: 319}
    notes_es: "Rueda trasera pegada a cámara (f319, ya en el hueco VO 13.18); luego el auto se aleja centrado hacia el reveal de focos"

  - id: A165_fog_city_rain
    recipe: amb.fog_air
    at: "cut[10]"
    dur: 2.4
    bus: AMB
    gain_db: -19
    params: {brightness: 0.65, motion: 0.5}
    width: 1.3
    fade_in: 0.15
    fade_out: 0.06
    until: "cut[12]+1"
    gain_curve: [[0, -5], [0.85, -5], [0.95, 0], [2.4, 0]]
    vo_protect: strong
    sync: {type: free}
    notes_es: "Lluvia fina en la calle con niebla (visible en los focos traseros y el semáforo peatonal); sube en el hueco VO 13.18"

  # ======================================================= 14.00-14.58 POSTE + SEMÁFORO PEATONAL (hueco VO 13.18-14.59)
  - id: A170_ped_signal
    recipe: fol.ped_signal
    at: "f:338"
    dur: 0.5
    bus: FOL
    gain_db: -11
    params: {count: 1, rate_hz: 1.0}
    pan: 0.3
    fade_out: 0.08
    until: "cut[12]+2"
    vo_protect: none
    sync: {type: frame, frame: 338}
    notes_es: "Un tic del semáforo peatonal en rojo (arriba a la derecha); la reverb de calle ya viene en la receta y corta 2 cuadros después del corte a la costa"

  - id: A175_ped_signal_passby
    recipe: veh.passby
    seed: 5                 # toma elegida: su pico de energía cae en el cuadro de sync
    at: "f:343"
    dur: 0.9
    bus: VEH
    gain_db: -11
    params: {speed_kmh: 18, closest_m: 2.5, direction: -1, surface: wet, ev: 0.4}
    fade_out: 0.06
    until: "cut[12]"
    gain_curve: [[0, -12], [0.15, -12], [0.3, 0]]
    vo_protect: none
    sync: {type: frame, frame: 343}
    notes_es: "El EX2 pasa lento detrás del poste de derecha a izquierda, neumáticos en mojado"

  # ======================================================= 14.58-15.71 AÉREO COSTA (J-cut 4 cuadros, L-cut 6)
  - id: A180_coast_surf
    recipe: amb.surf
    at: "cut[12]-4"
    dur: 1.6
    bus: AMB
    gain_db: -19
    params: {intensity: 0.6, crest_at: 0.44, distance: far}
    width: 1.2
    fade_in: 0.17
    fade_out: 0.25
    until: "cut[13]+3"
    gain_curve: [[0, 0], [0.85, 0], [1.1, -5], [1.6, -5]]
    vo_protect: strong
    sync: {type: free}   # J-cut: cama que entra antes del corte
    notes_es: "Olas rompiendo al pie del acantilado; cresta a mitad de plano (f363), después se retira 5 dB bajo la voz"

  - id: A185_cliff_wind
    recipe: amb.wind
    at: "cut[12]-4"
    dur: 1.9
    bus: AMB
    gain_db: -26
    params: {strength: 0.5, gustiness: 0.4, whistle: 0.15, texture: none}
    width: 1.15
    fade_in: 0.17
    fade_out: 0.06
    until: "cut[14]"
    vo_protect: strong
    sync: {type: free}   # J-cut: cama que entra antes del corte
    notes_es: "Viento del acantilado; sigue bajo la curva de grava (misma costa) y termina en el arco"

  # ======================================================= 15.71-16.29 CURVA DE GRAVA MOJADA (hueco VO 15.94-16.35)
  - id: A190_gravel_curve
    recipe: veh.gravel_curve
    seed: 4                 # toma elegida: su pico de energía cae en el cuadro de sync
    at: "f:385"
    dur: 1.0
    bus: VEH
    gain_db: -12
    params: {speed_kmh: 25, wet: true}
    fade_out: 0.06
    until: "cut[14]+2"
    gain_curve: [[0, -30], [0.40, -30], [0.47, 0]]
    vo_protect: none
    sync: {type: frame, frame: 385}
    notes_es: "Grava húmeda crujiendo en la curva, máximo cuando el auto encara a cámara (f385); 30 dB abajo bajo la voz y a pleno desde 16.0 s, dentro del hueco (sin protección)"

  # ======================================================= 16.29-18.29 ARCO DE ROCA / RUTA OSCURA / HACES
  - id: A200_rock_arch_passby
    recipe: veh.passby
    seed: 5                 # toma elegida: su pico de energía cae en el cuadro de sync
    at: "f:397"
    dur: 1.8
    bus: VEH
    gain_db: -21
    params: {speed_kmh: 50, closest_m: 18, direction: 1, surface: dry, ev: 0.3}
    fade_out: 0.15
    until: "f:418"
    gain_curve: [[0, -24], [0.6, -18], [0.75, 0], [1.05, 0], [1.4, -8]]
    send: {preset: rock_arch, db: -5}
    vo_protect: strong
    sync: {type: frame, frame: 397}
    notes_es: "Pass-by lejano visto a través del arco (16.5 s), la roca devuelve la reflexión; se aleja 8 dB en la ruta oscura"

