    notes_es: "EX2 avanzando entre las filas (micro-pausa VO 9.22-9.38 justo antes); queda lejano detrás del perfil"

  - id: A140_ex2_between_pandas_glide
    recipe: veh.wet_glide
    seed: 5                 # toma elegida: su pico de energía cae en el cuadro de sync
    at: "f:250"
    dur: 2.0
    bus: VEH
    gain_db: -21
    params: {speed_kmh: 12, sizzle: 0.5}
    width: 0.5
    fade_in: 0.3
    fade_out: 0.1
    until: "cut[9]+2"
    vo_protect: normal
    sync: {type: frame, frame: 250}
    notes_es: "Siseo lento de neumáticos en asfalto mojado, muy bajo; más cercano al final del plano (f250)"

  # ----- 10.54-12.29 perfil de panda (hueco VO 10.27-10.94)
  - id: A145_panda_profile_sniff
    recipe: cre.panda_breath
    at: "f:255"
    dur: 0.6
