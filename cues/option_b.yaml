# Opción B — "Cinemática / Sensorial"
# Sonido diseñado y estilizado: swells sub profundos e impactos suaves en los reveals, whooshes de aire en los
# movimientos rápidos y cortes, brillos tonales en destellos de luz y en la tira LED, un motivo de marca
# recurrente ("EV hum", des.ev_motif en Bb) que aparece en 0.0 / 3.96 / 9.42 / 23.63 y resuelve Bb->F en 48.58,
# swells reversos hacia las transiciones y casi nada de ambiente literal (texturas de niebla/aire en su lugar).
# Misterioso y premium, nunca "trailer": contención bajo la locución, generosidad en los huecos sin VO.
# Autos ELÉCTRICOS: nada de motor de combustión.
#
# Frames = verdad (24 fps). Spotting cuadro a cuadro sobre media/picture.mov (out/spot_b/tile_*.png).
# Sub-cortes vistos en imagen que no están en cuts[]: 56 (oscuro->torres), 308 (paso de rueda), 319 (focos
# traseros), 404/418 (arco -> ruta oscura -> haces), 747 (lago -> mano), 771 (bosque -> EX5), 801 (EX2 por
# parabrisas), 838 (capó), 989 (portón). Se citan como "f:<n>".
# Bombos reales (analysis/beat_grid.json kick_onsets_s; después de ~26 s el bombo deja la grilla de 118 BPM).
# Subs (bus SUB) caen entre bombos: 3.958 (bombos 3.629/4.145), 23.625 (23.469+0.156), 44.042 (sin bombo
# después de 43.163), 48.583 (remate sin música). Whoosh de corte 76 desplazado al bombo 3.128 (0.94 cuadro).
# Pisadas del panda leídas en recortes de las patas: toma 1 -> f160 / f168.6; remate -> f1128 / 1141 / 1145 / 1158.
option: B
title: "Cinemática / Sensorial"
