    params: {brightness: 0.45, drift: 0.5}
    width: 1.5
    fade_in: 0.35
    fade_out: 0.17
    until: "cut[0]+4"
    vo_protect: normal
    sync: {type: free}
    notes_es: "Niebla diseñada muy ancha (los lados del bed están libres) :: abre el mundo sin literalidad; cola L-cut de 4 cuadros sobre la rueda"

  - id: B020_open_motif
